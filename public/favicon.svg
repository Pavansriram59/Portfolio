<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161822" />
      <stop offset="100%" stop-color="#090a0e" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#06b6d4" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Game Controller Emblem -->
  <g filter="url(#glow)">
    <!-- Controller Body Outline -->
    <path d="M 18 22 C 24 20, 40 20, 46 22 C 52 24, 55 30, 54 38 C 53 44, 48 48, 44 46 C 40 44, 38 38, 32 38 C 26 38, 24 44, 20 46 C 16 48, 11 44, 10 38 C 9 30, 12 24, 18 22 Z" fill="#1e2230" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Center D-Pad Accent -->
    <path d="M 21 28 L 25 28 L 25 24 L 27 24 L 27 28 L 31 28 L 31 30 L 27 30 L 27 34 L 25 34 L 25 30 L 21 30 Z" fill="#38bdf8"/>
    <!-- Action Dots -->
    <circle cx="43" cy="27" r="2" fill="#38bdf8"/>
    <circle cx="40" cy="31" r="2" fill="#38bdf8"/>
    <circle cx="46" cy="31" r="2" fill="#38bdf8"/>
    <circle cx="43" cy="35" r="2" fill="#38bdf8"/>
  </g>
</svg>
