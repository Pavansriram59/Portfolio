<header class="w-full flex items-center justify-between">
  <!-- Unique Portfolio Brand Name -->
  <div class="flex items-center gap-2">
    <span class="text-xs font-mono font-bold tracking-widest text-primary px-2 py-0.5 rounded border border-primary/30 bg-primary/10">
      PLAYER 01
    </span>
    <span class="text-xs font-sans tracking-wider uppercase text-muted-foreground/90 font-semibold">
      PAVAN &bull; ARCHIVE
    </span>
  </div>

  <div class="flex items-center gap-3">
    <!-- Audio Toggle with Tooltip -->
    <button
      type="button"
      class="h-8 px-2.5 rounded-md border border-border/80 bg-card/60 backdrop-blur-md text-xs text-muted-foreground hover:text-foreground hover:border-primary/50 transition-colors flex items-center gap-1.5 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary cursor-pointer"
      (click)="audio.toggleMute()"
      [title]="audio.isMuted() ? 'Turn sound ON (Unmute UI sound effects)' : 'Turn sound OFF (Mute UI sound effects)'"
      [attr.aria-label]="audio.isMuted() ? 'Unmute sound effects' : 'Mute sound effects'"
    >
      <span>{{ audio.isMuted() ? '🔇' : '🔊' }}</span>
      <span class="hidden sm:inline text-[11px] font-medium">
        {{ audio.isMuted() ? 'Muted' : 'Sound' }}
      </span>
    </button>

    <!-- Theme Toggle with Tooltip -->
    <button
      type="button"
      class="h-8 px-2.5 rounded-md border border-border/80 bg-card/60 backdrop-blur-md text-xs text-muted-foreground hover:text-foreground hover:border-primary/50 transition-colors flex items-center gap-1.5 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary cursor-pointer"
      (click)="theme.toggle()"
      [title]="theme.isDark() ? 'Switch to Light Theme' : 'Switch to Dark Theme'"
      [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      <span>{{ theme.isDark() ? '🌙' : '☀️' }}</span>
      <span class="hidden sm:inline text-[11px] font-medium">
        {{ theme.isDark() ? 'Dark' : 'Light' }}
      </span>
    </button>
  </div>
</header>
