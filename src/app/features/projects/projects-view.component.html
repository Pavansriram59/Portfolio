<div class="py-12 sm:py-16 flex flex-col items-center justify-center text-center font-sans space-y-6">
  
  <!-- Subtle Glowing Icon / Tag -->
  <div class="h-16 w-16 rounded-2xl border border-border/80 bg-background/60 flex items-center justify-center text-2xl shadow-inner">
    ⚡
  </div>

  <!-- Main Message -->
  <div class="space-y-2 max-w-md mx-auto">
    <h3 class="text-2xl sm:text-3xl font-bold tracking-tight text-foreground">
      Coming Soon
    </h3>
    <p class="text-sm text-muted-foreground leading-relaxed">
      Personal projects and open-source experiments are currently in active development.
    </p>
  </div>

  <!-- Helper Box -->
  <div class="p-5 rounded-xl border border-border/70 bg-background/40 max-w-lg w-full text-left space-y-3">
    <div class="text-xs font-semibold text-primary uppercase tracking-wider">
      What to explore in the meantime:
    </div>
    <p class="text-xs text-muted-foreground leading-relaxed">
      You can review my professional enterprise contributions and architecture impact under the
      <button
        type="button"
        class="text-foreground font-semibold hover:text-primary underline underline-offset-2 transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary rounded px-0.5 cursor-pointer"
        (click)="gameState.navigate('experience')"
        title="Jump directly to Experience section [Shortcut: B]"
      >
        Experience [B]
      </button>
      section, or connect with me directly via
      <button
        type="button"
        class="text-foreground font-semibold hover:text-primary underline underline-offset-2 transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary rounded px-0.5 cursor-pointer"
        (click)="gameState.navigate('contact')"
        title="Jump directly to Contact section [Shortcut: Enter]"
      >
        Contact [MENU]
      </button>.
    </p>
  </div>

  <!-- Quick Action Buttons with Tooltips -->
  <div class="pt-2 flex flex-wrap items-center justify-center gap-3">
    <button
      type="button"
      class="px-4 py-2 rounded-lg border border-border bg-card text-xs font-semibold text-foreground hover:border-primary hover:text-primary transition-all focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary cursor-pointer"
      (click)="gameState.navigate('experience')"
      title="Open Experience section to explore career history [Shortcut: B]"
    >
      View Experience [B]
    </button>

    <button
      type="button"
      class="px-4 py-2 rounded-lg border border-border bg-card text-xs font-semibold text-foreground hover:border-primary hover:text-primary transition-all focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary cursor-pointer"
      (click)="gameState.navigate('contact')"
      title="Open Contact section to get in touch [Shortcut: Enter]"
    >
      Get in Touch [MENU]
    </button>
  </div>

</div>
