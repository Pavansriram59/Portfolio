<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PAVAN.OS // Redirecting...</title>
    <script>
      // Single Page Application redirect script for GitHub Pages
      // Stores requested URL and redirects to base index.html
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body style="background-color: #0a0b0d; color: #22d3ee; font-family: monospace; padding: 2rem;">
    <p>&gt; PAVAN_OS // REDIRECTING TO KERNEL ROOT...</p>
  </body>
</html>
